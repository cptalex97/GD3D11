name: Build and conditional release

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'

  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'

  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.configuration }})
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        include:
          - configuration: Launcher
            project: Launcher/Launcher.vcxproj
            output-file: ddraw.dll

          - configuration: Release
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g2a.dll

          - configuration: Release_AVX
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g2a_avx.dll

          - configuration: Release_AVX2
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g2a_avx2.dll

          - configuration: Release_G1
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g1.dll

          - configuration: Release_G1_12f
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g1a.dll

          - configuration: Release_G1_AVX
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g1_avx.dll

          - configuration: Release_G1_AVX2
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g1_avx2.dll

          - configuration: Spacer_NET
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g2_spacer.dll

          - configuration: Spacer_NET_G1
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g1_spacer.dll

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build configuration
        uses: ./.github/actions/build-configuration
        with:
          configuration: ${{ matrix.configuration }}
          project: ${{ matrix.project }}
          output-file: ${{ matrix.output-file }}

  # GOUC: x64 DLSS helper (DlssHost/, MIT) with NVIDIA's DLSS SDK. Lands in GD3D11/Bin/dlss/.
  build-dlss-host:
    name: build (DlssHost)
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout NVIDIA DLSS SDK
        uses: actions/checkout@v6
        with:
          repository: NVIDIA/DLSS
          ref: v310.9.16
          path: dlss-sdk
          sparse-checkout: |
            include
            lib/Windows_x86_64/x64
            lib/Windows_x86_64/rel
            LICENSE.txt
          sparse-checkout-cone-mode: false
          filter: blob:none

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build DLSS helper
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\outputs\dlss\"
          msbuild DlssHost/DlssHost.vcxproj /p:Configuration=Release /p:Platform=x64 "/p:DlssSdkDir=$env:GITHUB_WORKSPACE\dlss-sdk\" "/p:OutDir=$out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dlss-sdk/lib/Windows_x86_64/rel/nvngx_dlss.dll $out
          Copy-Item dlss-sdk/LICENSE.txt (Join-Path $out 'NVIDIA_RTX_SDK_LICENSE.txt')
          Copy-Item DlssHost/LICENSE (Join-Path $out 'LICENSE.txt')
          Copy-Item DlssHost/NOTICE.txt $out
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: DlssHost
          path: outputs/
          if-no-files-found: error
          compression-level: 1
          retention-days: 2

  package-artifacts:
    needs: [build, build-dlss-host]
    runs-on: ubuntu-latest

    outputs:
      artifact-id: ${{ steps.package-artifacts.outputs.artifact-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Package artifacts
        id: package-artifacts
        uses: ./.github/actions/package-artifacts

  create-release:
    if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_type == 'tag')
    needs: package-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout only composite actions
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
          filter: blob:none

      - name: Create release
        uses: ./.github/actions/create-release
        with:
          nightly: ${{ github.ref_type != 'tag' }}
          artifact-id: ${{ needs.package-artifacts.outputs.artifact-id }}
          token: ${{ secrets.GITHUB_TOKEN }}
